# Gemini CLI policy applied by the Claude Code gemini plugin to review runs.
# Reviews must be grounded in the repository, so web access is switched off.
# no-edits.toml and no-shell.toml keep reviews from editing files or running commands.

[[rule]]
toolName = ["google_web_search", "web_fetch"]
decision = "deny"
priority = 900
denyMessage = "Web access is off for reviews from Claude Code and cannot be switched on from inside them. Do not ask for it: carry on with the review using the repository alone."
